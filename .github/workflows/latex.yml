name: Vérifier et compiler les cours
on:
  pull_request:
    paths:
      - '**.tex'
      - '**.sty'
      - '**.py'
      - 'seconde/donnees/**'
      - '.github/workflows/latex.yml'
permissions:
  contents: read
concurrency:
  group: latex-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Installer LaTeX et les outils de contrôle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-lang-french lmodern poppler-utils python3-fitz python3-pil
      - name: Vérifier les algorithmes et les données
        run: python3 seconde/python/verifier.py
      - name: Compiler tous les niveaux avec le style commun
        run: python3 compiler.py
      - name: Vérifier la compilation d'un chapitre autonome
        run: python3 compiler.py --niveau seconde --chapitre 9
      - name: Contrôler et rendre les PDF
        run: /usr/bin/python3 scripts/verifier_rendu.py --destination verification/seconde
      - name: Publier les PDF vérifiés sur la branche de la PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$PR_BRANCH" != main
          git fetch origin "$PR_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/seconde verification/seconde
          if ! git diff --cached --quiet; then
            git commit -m "Compiler les PDF de seconde et préparer leur revue visuelle"
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
