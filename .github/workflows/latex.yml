name: Vérifier et compiler les cours
on:
  pull_request:
  push:
    tags: ['**']
permissions:
  contents: read
concurrency:
  group: latex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Construire le même environnement que Codespaces
        run: docker build -t maths-latex .devcontainer
      - name: Compiler, vérifier et préparer les documents de tous les niveaux
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work maths-latex make release
      - name: Vérifier les chapitres autonomes et le modèle
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work maths-latex python3 compiler.py --niveau seconde --chapitre 9
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work maths-latex python3 compiler.py --niveau premiere --chapitre 16
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work maths-latex python3 compiler.py --niveau terminale --chapitre 17
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work maths-latex python3 compiler.py --document modeles/modele_nouveau_cours.tex
      - uses: actions/upload-artifact@v7
        with:
          name: release-pdf
          path: build/release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: apercus
          path: build/apercus/
          if-no-files-found: error
          retention-days: 14
  publier:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: compiler
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-pdf
          path: release
      - name: Publier la release une fois tous les fichiers disponibles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > etat.json 2>/dev/null; then
            if ! python3 -c 'import json; assert json.load(open("etat.json"))["isDraft"]'; then
              echo 'Release déjà publiée : aucun fichier ne sera remplacé.'
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes "Cours, exercices, corrigés et guides compilés depuis ce tag."
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
